<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>MBTI 性格速测</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&display=swap');

    :root {
      color-scheme: light dark;
      --bg: #f3f1ec;
      --paper: #fffdf8;
      --ink: #162328;
      --muted: #657074;
      --line: #d9d8d2;
      --accent: #d84a3a;
      --accent-ink: #ffffff;
      --accent-soft: #f8ddd7;
      --teal: #126d69;
      --teal-soft: #d8ece8;
      --gold: #d4a331;
      --shadow: 0 22px 64px rgba(31, 41, 43, .10);
      --radius: 26px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101719;
        --paper: #182124;
        --ink: #f4f0e7;
        --muted: #aab5b5;
        --line: #334044;
        --accent: #f06b59;
        --accent-ink: #17191a;
        --accent-soft: #482722;
        --teal: #67c5bd;
        --teal-soft: #203d3c;
        --gold: #e2b750;
        --shadow: 0 26px 70px rgba(0, 0, 0, .34);
      }
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 13% 12%, color-mix(in srgb, var(--gold) 12%, transparent) 0 1px, transparent 2px) 0 0 / 22px 22px,
        var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }
    .app {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 48px);
    }

    .sheet {
      width: min(100%, 820px);
      min-height: min(760px, calc(100vh - 56px));
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }

    .sheet::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 7px;
      background: linear-gradient(var(--accent) 0 33.33%, var(--gold) 33.33% 66.66%, var(--teal) 66.66%);
    }

    .quiz-view, .result-view { min-height: inherit; }
    .quiz-view {
      display: flex;
      flex-direction: column;
      padding: clamp(25px, 5vw, 54px) clamp(23px, 7vw, 76px) clamp(24px, 5vw, 48px);
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .dimension {
      color: var(--teal);
      letter-spacing: .04em;
    }

    .progress-track {
      height: 5px;
      background: var(--line);
      margin-top: 17px;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width .28s ease;
    }

    .question-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(40px, 8vh, 76px) 0 32px;
    }

    .prompt-mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-family: Georgia, serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      max-width: 650px;
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: clamp(28px, 5vw, 46px);
      line-height: 1.3;
      letter-spacing: -.02em;
    }

    .hint {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: clamp(30px, 6vh, 52px);
    }

    .option {
      appearance: none;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper) 94%, var(--bg));
      color: var(--ink);
      border-radius: 18px;
      min-height: 118px;
      padding: 22px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }

    .option:hover { border-color: var(--accent); transform: translateY(-2px); }
    .option:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 3px; }
    .option.selected { border-color: var(--accent); background: var(--accent-soft); }

    .option-key {
      width: 30px;
      height: 30px;
      border: 1px solid currentColor;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      font: 800 14px/1 ui-sans-serif, sans-serif;
      color: var(--accent);
    }

    .option-text { font-size: clamp(16px, 2.4vw, 19px); line-height: 1.55; font-weight: 700; }

    .controls {
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .back {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 9px 0;
      cursor: pointer;
      font-weight: 700;
    }
    .back[disabled] { opacity: .25; cursor: default; }
    .key-hint { color: var(--muted); font-size: 12px; }

    .result-view {
      display: none;
      padding: clamp(30px, 6vw, 64px) clamp(24px, 7vw, 72px) 42px;
    }

    .result-view.active { display: block; }
    .quiz-view.hidden { display: none; }

    .result-kicker {
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .result-head {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 25px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 30px;
    }

    .type-stamp {
      width: 142px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--ink);
      color: var(--paper);
      display: grid;
      place-items: center;
      position: relative;
    }
    .type-stamp::after {
      content: "";
      position: absolute;
      inset: 9px;
      border: 1px solid color-mix(in srgb, var(--paper) 45%, transparent);
      border-radius: 50%;
    }
    .type-code { font: 900 29px/1 Georgia, serif; letter-spacing: .05em; z-index: 1; }

    .result-title {
      margin: 0;
      font-family: "Noto Serif SC", "Songti SC", serif;
      font-size: clamp(34px, 6vw, 54px);
      line-height: 1.14;
    }
    .keywords { margin: 12px 0 0; color: var(--teal); font-weight: 800; letter-spacing: .04em; }

    .result-body {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: clamp(28px, 6vw, 58px);
      padding-top: 34px;
    }

    .description { margin: 0; font-size: 17px; line-height: 1.9; }
    .takeaways { margin-top: 27px; display: grid; gap: 12px; }
    .takeaway { padding: 16px 18px; background: var(--teal-soft); border-radius: 12px; line-height: 1.6; }
    .takeaway strong { display: block; color: var(--teal); font-size: 13px; margin-bottom: 3px; }

    .axes-title { margin: 0 0 18px; font-size: 15px; }
    .axis { margin-bottom: 18px; }
    .axis-labels { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; margin-bottom: 7px; }
    .axis-track { height: 9px; border-radius: 99px; background: var(--line); position: relative; overflow: hidden; }
    .axis-fill { position: absolute; top: 0; bottom: 0; border-radius: inherit; background: var(--gold); }
    .axis-note { color: var(--muted); font-size: 12px; margin-top: 6px; text-align: right; }

    .actions { display: flex; gap: 11px; flex-wrap: wrap; margin-top: 28px; }
    .action {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 800;
      cursor: pointer;
    }
    .action.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .action:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }

    .disclaimer { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 28px 0 0; }
    .toast { min-height: 20px; margin-top: 8px; font-size: 13px; color: var(--teal); font-weight: 700; }

    @media (max-width: 660px) {
      .app { display: block; padding: 0; }
      .sheet { min-height: 100vh; border: 0; border-radius: 0; box-shadow: none; }
      .sheet::before { width: 5px; }
      .quiz-view { padding-left: 23px; padding-right: 18px; }
      .question-wrap { justify-content: flex-start; padding-top: clamp(58px, 10vh, 90px); }
      .options { grid-template-columns: 1fr; gap: 11px; margin-top: 34px; }
      .option { min-height: 86px; padding: 18px; align-items: center; }
      .key-hint { display: none; }
      .result-head { grid-template-columns: 1fr; align-items: start; }
      .type-stamp { width: 112px; }
      .type-code { font-size: 24px; }
      .result-body { grid-template-columns: 1fr; }
      .result-view { padding-left: 25px; padding-right: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="sheet" aria-live="polite">
      <div class="quiz-view" id="quizView">
        <div class="topline">
          <span class="dimension" id="dimensionLabel">能量偏好 · E / I</span>
          <span id="counter">01 / 30</span>
        </div>
        <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>

        <div class="question-wrap">
          <div class="prompt-mark" aria-hidden="true">?</div>
          <h1 id="questionText"></h1>
          <p class="hint">凭第一直觉选择，更接近你平时的状态即可。</p>
          <div class="options" id="options"></div>
        </div>

        <div class="controls">
          <button class="back" id="backBtn" type="button">← 上一题</button>
          <span class="key-hint">键盘按 1 / 2 也能作答</span>
        </div>
      </div>

      <div class="result-view" id="resultView">
        <div class="result-kicker">你的性格偏好结果</div>
        <div class="result-head">
          <div class="type-stamp"><span class="type-code" id="typeCode"></span></div>
          <div>
            <h1 class="result-title" id="resultTitle"></h1>
            <p class="keywords" id="keywords"></p>
          </div>
        </div>

        <div class="result-body">
          <div>
            <p class="description" id="description"></p>
            <div class="takeaways">
              <div class="takeaway"><strong>你的优势</strong><span id="strength"></span></div>
              <div class="takeaway"><strong>给你的建议</strong><span id="advice"></span></div>
            </div>
          </div>
          <div>
            <h2 class="axes-title">四维偏好</h2>
            <div id="axes"></div>
            <div class="actions">
              <button class="action primary" id="copyBtn" type="button">复制结果</button>
              <button class="action" id="restartBtn" type="button">重新测试</button>
            </div>
            <div class="toast" id="toast" role="status"></div>
          </div>
        </div>
        <p class="disclaimer">本测试用于娱乐与自我探索，不构成专业心理评估或诊断。人的偏好会随情境与经历变化，结果不必成为限制。</p>
      </div>
    </section>
  </main>

        ISFP:["探险家","随性 · 审美 · 真我","你对美与氛围有天然感知，更愿意按照自己的节奏生活。看起来温和好相处，内在却十分重视自由与真实。","审美敏锐、不轻易内耗。","好想法别只放心里，说出来、试试看。"],
        ESTP:["企业家","果敢 · 冒险 · 当下","你偏爱行动胜过空谈，想到就做是很自然的状态。变化与挑战反而会激发你的反应力，实战常是你最好的课堂。","执行力强、临场反应快。","行动前多看一眼风险，给冲劲加一道护栏。"],
        ESFP:["表演者","快乐 · 表现 · 感染","你热爱生活，也擅长把现场变得有趣。你的活力很有感染力，和你在一起的人通常不缺笑声；体验当下对你非常重要。","感染力强、很会带动气氛。","享受当下之余，也为未来留一点规划。"]
      };

      var groups = [
        {start:0,end:7,label:"能量偏好 · E / I",left:"E 外向",right:"I 内向"},
        {start:8,end:14,label:"信息偏好 · S / N",left:"S 实感",right:"N 直觉"},
        {start:15,end:22,label:"决策偏好 · T / F",left:"T 思考",right:"F 情感"},
        {start:23,end:29,label:"生活偏好 · J / P",left:"J 判断",right:"P 知觉"}
      ];

      var current = 0;
      var answers = new Array(questions.length);
      var quizView = document.getElementById('quizView');
      var resultView = document.getElementById('resultView');
      var questionText = document.getElementById('questionText');
      var options = document.getElementById('options');
      var counter = document.getElementById('counter');
      var dimensionLabel = document.getElementById('dimensionLabel');
      var progressBar = document.getElementById('progressBar');
      var backBtn = document.getElementById('backBtn');
      var toast = document.getElementById('toast');

      function groupFor(index) {
        for (var i = 0; i < groups.length; i++) if (index >= groups[i].start && index <= groups[i].end) return groups[i];
      }

      function renderQuestion() {
        var q = questions[current];
        var saved = answers[current];
        var number = String(current + 1).padStart(2, '0');
        counter.textContent = number + ' / 30';
        dimensionLabel.textContent = groupFor(current).label;
        progressBar.style.width = (((current + 1) / questions.length) * 100) + '%';
        questionText.textContent = q[0];
        options.innerHTML = '';
        [['A', q[1]], ['B', q[2]]].forEach(function (item) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'option' + (saved === item[0] ? ' selected' : '');
          btn.setAttribute('aria-label', item[0] + '，' + item[1]);
          btn.innerHTML = '<span class="option-key">' + item[0] + '</span><span class="option-text"></span>';
          btn.querySelector('.option-text').textContent = item[1];
          btn.addEventListener('click', function () { choose(item[0]); });
          options.appendChild(btn);
        });
        backBtn.disabled = current === 0;
      }

      function choose(value) {
        answers[current] = value;
        if (current === questions.length - 1) {
          showResult();
        } else {
          current += 1;
          renderQuestion();
        }
      }

      function scoreGroup(group, letters) {
        var a = 0;
        for (var i = group.start; i <= group.end; i++) if (answers[i] === 'A') a++;
        var total = group.end - group.start + 1;
        var b = total - a;
        var winner;
        if (a === b) winner = answers[group.start] === 'A' ? letters[0] : letters[1];
        else winner = a > b ? letters[0] : letters[1];
        var share = Math.round((Math.max(a, b) / total) * 100);
        var note = a === b ? '两端均衡' : (Math.abs(a - b) <= 1 ? '轻微倾向' : (Math.abs(a - b) <= 3 ? '中等倾向' : '明显倾向'));
        return {winner:winner,a:a,b:b,total:total,share:share,note:note};
      }

      function calculate() {
        var s1 = scoreGroup(groups[0], ['E','I']);
        var s2 = scoreGroup(groups[1], ['S','N']);
        var s3 = scoreGroup(groups[2], ['T','F']);
        var s4 = scoreGroup(groups[3], ['J','P']);
        return {type:s1.winner+s2.winner+s3.winner+s4.winner, scores:[s1,s2,s3,s4]};
      }

      function showResult() {
        var result = calculate();
        var profile = profiles[result.type];
        document.getElementById('typeCode').textContent = result.type;
        document.getElementById('resultTitle').textContent = profile[0];
        document.getElementById('keywords').textContent = profile[1];
        document.getElementById('description').textContent = profile[2];
        document.getElementById('strength').textContent = profile[3];
        document.getElementById('advice').textContent = profile[4];

        var axes = document.getElementById('axes');
        axes.innerHTML = '';
        result.scores.forEach(function (score, i) {
          var group = groups[i];
          var pctA = Math.round((score.a / score.total) * 100);
          var axis = document.createElement('div');
          axis.className = 'axis';
          axis.innerHTML = '<div class="axis-labels"><span>' + group.left + ' ' + pctA + '%</span><span>' + (100-pctA) + '% ' + group.right + '</span></div>' +
            '<div class="axis-track"><div class="axis-fill" style="left:0;width:' + pctA + '%"></div></div>' +
            '<div class="axis-note">' + score.note + '</div>';
          axes.appendChild(axis);
        });

        quizView.classList.add('hidden');
        resultView.classList.add('active');
        resultView.scrollIntoView({block:'start'});
      }

      backBtn.addEventListener('click', function () {
        if (current > 0) { current -= 1; renderQuestion(); }
      });

      document.getElementById('restartBtn').addEventListener('click', function () {
        answers = new Array(questions.length);
        current = 0;
        resultView.classList.remove('active');
        quizView.classList.remove('hidden');
        toast.textContent = '';
        renderQuestion();
        window.scrollTo({top:0, behavior:'smooth'});
      });

      document.getElementById('copyBtn').addEventListener('click', function () {
        var result = calculate();
        var profile = profiles[result.type];
        var text = '我的 MBTI 性格速测结果：' + result.type + ' ' + profile[0] + '\n' + profile[1] + '\n优势：' + profile[3] + '\n建议：' + profile[4] + '\n（娱乐测试，结果仅供参考）';
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { toast.textContent = '结果已复制'; }, function () { fallbackCopy(text); });
        } else fallbackCopy(text);
      });

      function fallbackCopy(text) {
        var area = document.createElement('textarea');
        area.value = text;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        try { document.execCommand('copy'); toast.textContent = '结果已复制'; }
        catch (e) { toast.textContent = '复制失败，请长按结果文字复制'; }
        document.body.removeChild(area);
      }

      document.addEventListener('keydown', function (event) {
        if (quizView.classList.contains('hidden')) return;
        if (event.key === '1' || event.key.toLowerCase() === 'a') choose('A');
        if (event.key === '2' || event.key.toLowerCase() === 'b') choose('B');
        if (event.key === 'ArrowLeft' && current > 0) { current -= 1; renderQuestion(); }
      });

      renderQuestion();
    })();
  </script>
</body>
</html>
